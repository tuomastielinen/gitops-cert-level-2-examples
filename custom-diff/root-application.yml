apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: problematic-apps
  namespace: argocd
  # Poistaa lapsisovellukset, kun juuri poistetaan
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/tuomastielinen/gitops-cert-level-2-examples.git
    targetRevision: HEAD
    path: ./custom-diff/applications
    directory:
      recurse: false

  # Juuren hallitsemat resurssit ovat Application-objekteja,
  # joten kohde on argocd-namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
